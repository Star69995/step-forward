<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Colors the iOS Safari status bar/toolbar to match the header gradient's
     leading color (--color-headerFrom in src/index.css). The header gradient
     doesn't change between light/dark mode, so this stays a static value
     rather than something toggled by the theme script below. -->
    <meta name="theme-color" content="#667eea" />
    <title>צעד קדימה</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("themeMode") || "auto";
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute(
            "data-theme",
            stored === "auto" ? (dark ? "dark" : "light") : stored
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
