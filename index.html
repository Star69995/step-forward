<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lets the app run full-screen (no Safari chrome) when launched from the
     iOS home screen; Android/Chrome installability comes from the web
     manifest instead (display: "standalone" below), but this tag is still
     honored by some Chromium-based installers. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="צעד קדימה" />
    <!-- Colors the browser toolbar/status bar to match the header. Value is
     --color-headerMid in src/index.css (the flat midpoint blend of
     headerFrom/headerTo — a solid tint can't match a left-to-right gradient
     on both edges, so the midpoint keeps the seam roughly even instead of
     matching one edge and clashing hard on the other). Still honored by
     Chrome/Android and pre-26 Safari, but iOS 26 Safari dropped support for
     this tag entirely and instead derives the color from the actual
     background-color CSS of the sticky header (see Header.jsx's bg-headerMid
     class) — kept here as a harmless fallback for other browsers, not as the
     primary mechanism. The header gradient doesn't change between light/dark
     mode, so this stays a static value. -->
    <meta name="theme-color" content="#6e64c6" />
    <title>צעד קדימה</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("themeMode") || "auto";
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute(
            "data-theme",
            stored === "auto" ? (dark ? "dark" : "light") : stored
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
